version: '3.8'

services:
  # SQL Server database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ai-trading-sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD:?SA_PASSWORD environment variable is required}
      - MSSQL_PID=Developer
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - ai-trading-network

  # Redis cache for idempotency
  redis:
    image: redis:7-alpine
    container_name: ai-trading-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ai-trading-network

  # ML Service (Python FastAPI)
  ml-service:
    build:
      context: ./ai-trading-race-ml
      dockerfile: Dockerfile
    container_name: ai-trading-ml-service
    ports:
      - "8000:8000"
    environment:
      - ML_SERVICE_MODEL_PATH=models/trading_model.pkl
      - ML_SERVICE_MODEL_VERSION=1.0.0
      - ML_SERVICE_LOG_LEVEL=INFO
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY:?ML_SERVICE_API_KEY environment variable is required}
      - ML_SERVICE_ALLOWED_ORIGIN=${ML_SERVICE_ALLOWED_ORIGIN:-http://localhost:5173}
      - ML_SERVICE_REDIS_ENABLED=true
      - ML_SERVICE_REDIS_HOST=redis
      - ML_SERVICE_REDIS_PORT=6379
      - ML_SERVICE_REDIS_DB=0
      - ML_SERVICE_REDIS_TTL_SECONDS=3600
      # Internal research API v1 (/internal/v1/*). The signing key is shared with .NET
      # (ResearchEngine:SigningKey) and signs TransitionProposals and StrategyResults.
      - ML_SERVICE_SIGNING_KEY=${ML_SERVICE_SIGNING_KEY:?ML_SERVICE_SIGNING_KEY environment variable is required}
      - RESEARCH_SIGNING_KEY=${RESEARCH_SIGNING_KEY:?RESEARCH_SIGNING_KEY environment variable is required}
      - ML_SERVICE_STRATEGY_PROVIDER=${ML_SERVICE_STRATEGY_PROVIDER:-reference}
      - ML_SERVICE_STRATEGY_MODEL=${ML_SERVICE_STRATEGY_MODEL:-}
      - ML_SERVICE_STRATEGY_BASE_URL=${ML_SERVICE_STRATEGY_BASE_URL:-}
      - ML_SERVICE_RECORDED_RESPONSES_DIR=${ML_SERVICE_RECORDED_RESPONSES_DIR:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ML_SERVICE_MAX_CONCURRENT_DECISIONS=${ML_SERVICE_MAX_CONCURRENT_DECISIONS:-4}
      - ML_SERVICE_DECISION_RETRY_AFTER_SECONDS=5
      - ML_SERVICE_EVIDENCE_AUTOLOAD=${ML_SERVICE_EVIDENCE_AUTOLOAD:-fixtures}
      - ML_SERVICE_INGESTION_ONLINE=${ML_SERVICE_INGESTION_ONLINE:-false}
      - ML_SERVICE_ACTIVATE_INDEX_BUILDS=true
      - ML_SERVICE_WARM_CURVES=true
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - ai-trading-network

  # Azurite (Azure Storage Emulator for Azure Functions)
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: ai-trading-azurite
    ports:
      - "10000:10000"  # Blob service
      - "10001:10001"  # Queue service
      - "10002:10002"  # Table service
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    volumes:
      - azurite-data:/data
    restart: unless-stopped
    networks:
      - ai-trading-network

  # Neo4j graph backend for evidence retrieval (optional: docker compose --profile graph up neo4j)
  neo4j:
    image: neo4j:5.26-community
    container_name: ai-trading-neo4j
    profiles: ["graph"]
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      # Loopback-only development default; set NEO4J_PASSWORD for anything shared.
      # (A required ":?" variable would break `docker compose up` without the profile.)
      # Not NEO4J_-prefixed: the image maps NEO4J_* variables to server settings.
      - GRAPH_HEALTH_PASSWORD=${NEO4J_PASSWORD:-local-dev-graph-only}
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-local-dev-graph-only}
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$GRAPH_HEALTH_PASSWORD\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - ai-trading-network

volumes:
  neo4j-data:
    driver: local
  sqlserver-data:
    driver: local
  redis-data:
    driver: local
  azurite-data:
    driver: local

networks:
  ai-trading-network:
    driver: bridge
